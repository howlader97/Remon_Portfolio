  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Remon Portfolio">

  <!-- Favicon with cache busting -->
  <link rel="shortcut icon" href="favicon.ico?v=4" type="image/x-icon">
  <link rel="icon" type="image/x-icon" href="favicon.ico?v=4">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png?v=4">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/Icon-192.png?v=4">
  <link rel="icon" type="image/png" sizes="512x512" href="icons/Icon-512.png?v=4">

  <title>Remon Chandra Howlader | Senior Flutter & Mobile Architect</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      background-color: #0E2338;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #loading-container {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #0E2338;
      z-index: 9999;
      transition: opacity 0.4s ease-out;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(0, 210, 255, 0.15);
      border-top-color: #00D2FF;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    .loading-text {
      margin-top: 18px;
      color: #94A3B8;
      font-size: 13px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      font-weight: 600;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading-container">
    <div class="spinner"></div>
    <div class="loading-text">Loading Remon's Portfolio...</div>
  </div>

  <script>
    // Prevent browser caching - purge service worker & cache storage on visit
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (var i = 0; i < registrations.length; i++) {
          registrations[i].unregister();
        }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(keys) {
        for (var i = 0; i < keys.length; i++) {
          caches.delete(keys[i]);
        }
      });
    }

    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('loading-container');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(function () {
          loader.remove();
        }, 400);
      }
    });
  </script>

  <script src="flutter_bootstrap.js?v=2" async></script>
</body>
</html>
